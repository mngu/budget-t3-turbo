packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  "@code-inspector/core": set this to true or false
  "@prisma/client": set this to true or false
  "@prisma/engines": set this to true or false
  better-sqlite3: set this to true or false
  bufferutil: set this to true or false
  core-js-pure: set this to true or false
  esbuild: set this to true or false
  node-pty: set this to true or false
  prisma: set this to true or false
  utf-8-validate: set this to true or false

catalog:
  "@better-auth/expo": 1.7.7
  "@tailwindcss/vite": ^4.2.0
  "@trpc/client": ^11.19.0
  "@trpc/server": ^11.19.0
  "@trpc/tanstack-react-query": ^11.19.0
  "@types/node": 22.18.12
  "@vitejs/plugin-react": 5.1.0
  auth: 1.7.7
  better-auth: 1.7.7
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vite: 7.1.12
  zod: ^4.1.12

catalogs:
  react19:
    "@types/react": ~19.2.0
    "@types/react-dom": ~19.2.0
    react: 19.2.3
    react-dom: 19.2.3

linkWorkspacePackages: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild

overrides:
  "@types/minimatch": 5.1.2
  lightningcss: 1.30.1
  vite: 7.1.12

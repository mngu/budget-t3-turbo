packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  '@code-inspector/core': set this to true or false
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  better-sqlite3: set this to true or false
  bufferutil: set this to true or false
  core-js-pure: set this to true or false
  esbuild: set this to true or false
  node-pty: set this to true or false
  prisma: set this to true or false
  utf-8-validate: set this to true or false

catalog:
  '@better-auth/cli': 1.4.0-beta.9
  '@eslint/js': ^9.38.0
  '@tailwindcss/vite': ^4.2.0
  '@tanstack/react-query': ^5.90.8
  '@trpc/client': ^11.7.1
  '@trpc/server': ^11.7.1
  '@trpc/tanstack-react-query': ^11.7.1
  '@types/node': 22.18.12
  '@vitejs/plugin-react': 5.1.0
  better-auth: 1.4.0-beta.9
  eslint: ^9.38.0
  prettier: ^3.6.2
  tailwindcss: 4.3.3
  typescript: 5.9.3
  vite: 7.1.12
  zod: ^4.1.12

catalogs:
  react19:
    '@types/react': ~19.1.0
    '@types/react-dom': ~19.1.0
    react: 19.1.4
    react-dom: 19.1.4

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

overrides:
  '@types/minimatch': 5.1.2
  lightningcss: 1.30.1
  vite: 7.1.12

publicHoistPattern:
  - '@ianvs/prettier-plugin-sort-imports'
  - prettier-plugin-tailwindcss

# Déployé dans /docker/budget/ sur le VPS Hostinger (vps), à côté du
# projet `traefik` qui y tourne déjà : provider Docker, resolver `letsencrypt`,
# redirection web -> websecure. Traefik est en `network_mode: host` et joint les
# conteneurs par leur IP de bridge — d'où le port annoncé en label.
name: budget

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Origine publique : better-auth y pose ses cookies et le client tRPC SSR
      # s'y appelle. Sans elle, retombée sur http://localhost:3000.
      SITE_URL: ${SITE_URL}
      POSTGRES_URL: postgres://budget:${POSTGRES_PASSWORD}@db:5432/budget_t3
      AUTH_SECRET: ${AUTH_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Obligatoires : la connexion se fait uniquement par lien email, il n'y
      # a pas de mot de passe. Sans eux, l'envoi lève et personne n'entre.
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
    volumes:
      # JSON Enable Banking : les perdre impose une re-synchro, donc une SCA.
      - budget-data:/data
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.budget.rule=Host(`${SITE_HOST}`)
      - traefik.http.routers.budget.entrypoints=websecure
      - traefik.http.routers.budget.tls.certresolver=letsencrypt
      - traefik.http.services.budget.loadbalancer.server.port=3000

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: budget_t3
    # Volontairement aucun `ports:` — la publication Docker contourne le
    # pare-feu de l'hôte, et ce VPS n'a pas de firewall group. La base n'est
    # jointe que par le réseau du projet.
    volumes:
      - pgdata:/var/lib/postgresql/data
      # pg_trgm (catégorisation few-shot), à la création initiale du volume.
      - ./docker-initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_t3"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  budget-data:
  pgdata:

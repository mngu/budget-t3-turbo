# Deployed in /docker/budget alongside host-networked Traefik, which reaches
# containers by bridge IP and the service port declared below.
name: budget

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL}
      POSTGRES_URL: postgres://budget:${POSTGRES_PASSWORD}@db:5432/budget_t3
      AUTH_SECRET: ${AUTH_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Required for magic-link login in production.
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
    volumes:
      # Preserve bank exports so replaying imports does not require another bank sync.
      - budget-data:/data
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.budget.rule=Host(`${SITE_HOST}`)
      - traefik.http.routers.budget.entrypoints=websecure
      - traefik.http.routers.budget.tls.certresolver=letsencrypt
      - traefik.http.services.budget.loadbalancer.server.port=3000

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: budget_t3
    # Do not publish PostgreSQL: Docker port publishing can bypass the host firewall.
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Initialization scripts run only on a new volume.
      - ./docker-initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_t3"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  budget-data:
  pgdata:

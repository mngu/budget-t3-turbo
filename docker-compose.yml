# Shares the legacy project's PostgreSQL instance and volume.
# This project's database is budget_t3; budget belongs to the legacy repository.
name: budget-tracker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget_t3
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Initialization scripts run only on a new volume.
      - ./docker-initdb:/docker-entrypoint-initdb.d

volumes:
  pgdata:
